<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jurnal Harian Mengajar Guru</title>
<style>
:root{--bg:#eef2f6;--card:#fff;--ink:#1f2a37;--mute:#5b6b7c;--line:#d3dce6;--ac:#0f6b6b;--sk:#b45309;--iz:#1d4ed8;--al:#b91c1c;--hd:#166534;--bt:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#10171e;--card:#18222c;--ink:#e6edf3;--mute:#9aa9b8;--line:#2c3a48;--ac:#3fb5b5;--sk:#f59e0b;--iz:#7aa2ff;--al:#f87171;--hd:#4ade80;--bt:#06201f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--ac);color:var(--bt);padding:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header h1{margin:0;font:700 21px Georgia,serif}
header p{margin:2px 0 0;font-size:14px;opacity:.9}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.login{max-width:420px;margin:30px auto}
h2{margin:0 0 12px;font:700 17px Georgia,serif}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.wide{grid-column:1/-1}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:3px}
input,textarea,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font:inherit}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
input[readonly],select:disabled{opacity:.75}
textarea{min-height:90px;resize:vertical}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
button{padding:9px 14px;border:1px solid var(--ac);border-radius:7px;background:var(--ac);color:var(--bt);font:inherit;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
button.sec{background:transparent;color:var(--ac)}
header button{background:transparent;color:var(--bt);border-color:var(--bt)}
button.dg{background:transparent;border-color:var(--al);color:var(--al)}
button.sm{padding:4px 9px;font-size:13px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:12px}
.tools>div{flex:1 1 160px}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:900px}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:14px}
th{background:var(--bg);font-weight:600}
.n{text-align:center;white-space:nowrap}
.s{color:var(--sk)}.i{color:var(--iz)}.a{color:var(--al)}.h{color:var(--hd)}
tfoot td{font-weight:700;background:var(--bg)}
.empty{padding:24px;text-align:center;color:var(--mute)}
.note{font-size:13px;color:var(--mute);margin:10px 0 0}
.err{color:var(--al);font-size:14px;margin:8px 0 0}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:7px;display:none;z-index:9}
.printhead,.hide{display:none}
@media print{header,#formcard,.tools,.noprint,#toast{display:none!important}
body{background:#fff;color:#000}.card{border:0;padding:0}.printhead{display:block;margin-bottom:10px}
table{min-width:0}th,td{font-size:11px;border:1px solid #888;color:#000}}
@media (max-width: 768px){
  body{font-size:14px}
  header{padding:12px}
  header h1{font-size:18px}
  main{padding:12px}
  .login{margin:20px auto}
  .grid{grid-template-columns:1fr}
  .btns{display:grid;grid-template-columns:1fr}
  .btns > button,.btns > .sec{width:100%}
  header button{width:auto}
  .tools{display:grid;grid-template-columns:1fr}
  .wrap{overflow-x:auto}
  table{min-width:680px}
}
@media (max-width: 480px){
  header{align-items:flex-start}
  header h1{font-size:17px}
  .card{padding:12px}
  .btns{gap:6px}
  button{padding:10px 12px}
}
</style>
</head>
<body>
<header>
<div><h1>Jurnal Harian Mengajar Guru</h1><p id="who">Catat kegiatan mengajar dan kehadiran siswa</p></div>
<button id="out" class="hide">Keluar</button>
</header>
<main>
<section class="card login" id="loginbox">
<h2>Masuk</h2>
<div class="grid">
<div class="wide"><label for="ln">Nama guru</label><select id="ln"><option value="">Memuat daftar guru...</option></select></div>
<div class="wide"><label for="lp">PIN</label><input type="password" id="lp" inputmode="numeric" autocomplete="current-password" placeholder="PIN dari admin sekolah"></div>
</div>
<div class="btns"><button id="login">Masuk</button></div>
<p class="err" id="lerr"></p>
</section>

<div id="app" class="hide">
<section class="card" id="formcard">
<h2 id="ftitle">Catat jurnal baru</h2>
<div class="grid">
<div><label for="tgl">Tanggal</label><input type="date" id="tgl"></div>
<div><label for="hari">Hari</label><input id="hari" readonly></div>
<div class="wide"><label for="guru">Nama guru</label><select id="guru"></select></div>
<div><label for="jam">Jam ke-</label><input id="jam" placeholder="Contoh: 1-2"></div>
<div><label for="kelas">Kelas</label><input id="kelas" placeholder="Contoh: VII A"></div>
<div class="wide"><label for="mapel">Mata pelajaran</label><input id="mapel" placeholder="Contoh: Matematika"></div>
<div class="wide"><label for="materi">Uraian materi</label><textarea id="materi" placeholder="Tulis materi yang diajarkan dan kegiatan pembelajaran"></textarea></div>
<div><label for="total">Jumlah siswa di kelas</label><input type="number" id="total" min="0" value="0"></div>
<div><label for="sakit">Sakit</label><input type="number" id="sakit" min="0" value="0"></div>
<div><label for="izin">Izin</label><input type="number" id="izin" min="0" value="0"></div>
<div><label for="alpa">Alpa</label><input type="number" id="alpa" min="0" value="0"></div>
<div><label for="hadir">Hadir (dihitung otomatis)</label><input id="hadir" readonly></div>
<div class="wide"><label for="ket">Nama siswa tidak hadir dan catatan (opsional)</label><input id="ket" placeholder="Contoh: Sakit: Andi. Izin: Budi. Alpa: Citra"></div>
</div>
<div class="btns"><button id="save">Simpan jurnal</button><button class="sec" id="reset">Kosongkan form</button></div>
</section>

<section class="card admin-panel hide" id="adminpanel">
<h2>Kelola Guru</h2>
<div class="grid">
<div class="wide"><label for="adminNama">Nama guru</label><input id="adminNama" placeholder="Contoh: DADUN EKO WIDODO, S.Pd."></div>
<div><label for="adminPin">PIN</label><input id="adminPin" inputmode="numeric" placeholder="Contoh: 1234"></div>
<div><label for="adminPeran">Peran</label><select id="adminPeran"><option value="guru">Guru</option><option value="admin">Admin</option></select></div>
</div>
<div class="btns">
<button id="adminSave">Simpan perubahan</button>
<button class="sec" id="adminAdd">Tambah baru</button>
<button class="sec" id="adminResetForm">Batal</button>
</div>
<div class="wrap">
<table>
<thead><tr><th>No</th><th>Nama Guru</th><th>PIN</th><th>Peran</th><th>Aksi</th></tr></thead>
<tbody id="adminRows"></tbody>
</table>
</div>
</section>

<section class="card">
<h2 id="ltitle">Daftar jurnal</h2>
<div class="tools">
<div><label for="bulan">Bulan</label><input type="month" id="bulan"></div>
<div id="fgbox" class="hide"><label for="fg">Guru</label><select id="fg"></select></div>
<div><label for="cari">Cari mapel, kelas, atau materi</label><input id="cari" placeholder="Ketik kata kunci"></div>
<div class="noprint"><button class="sec" id="semua">Semua bulan</button></div>
</div>
<div class="printhead" id="ph"></div>
<div class="wrap"><table>
<thead><tr><th class="n">No</th><th>Hari, tanggal</th><th>Nama guru</th><th class="n">Jam ke-</th><th>Kelas</th><th>Mata pelajaran</th><th>Uraian materi</th><th class="n">Jml</th><th class="n">Ha[...]
<tbody id="rows"></tbody><tfoot id="foot"></tfoot>
</table></div>
<div class="btns noprint">
<button class="sec" id="csv">Unduh Excel (CSV)</button>
<button class="sec" id="print">Cetak atau simpan PDF</button>
<button class="sec" id="refresh">Muat ulang data</button>
</div>
</section>
</div>
</main>
<div id="toast" role="status"></div>
<script>
const STORAGE = {
  guru: 'jurnalGuruList',
  users: 'jurnalUserAccounts',
  journals: 'jurnalData'
};

const DEFAULT_GURU = [
  { nama: 'DADUN EKO WIDODO, S.Pd.', peran: 'admin' },
  { nama: 'YEYEN LESTARI, S.Pd.', peran: 'guru' },
  { nama: 'EDI SAPTONO ROSIDI, S.Pd.', peran: 'guru' },
  { nama: 'ARI TRIWINARSIH, S.Pd.', peran: 'guru' },
  { nama: 'ERRY WILLYANTI, S.Pd.', peran: 'guru' },
  { nama: 'DADUN EKO WIDODO, S.Pd.', peran: 'guru' },
  { nama: 'SRI SUBEKTI, S.Pd.', peran: 'guru' },
  { nama: 'WIDIA HASTUTI, S.Pd.', peran: 'guru' },
  { nama: 'BUDI MULYONO, S.Pd.', peran: 'guru' },
  { nama: 'DARMINI, S.Pd.', peran: 'guru' }
];

const DEFAULT_USERS = [
  { nama: 'DADUN EKO WIDODO, S.Pd.', pin: '12345', peran: 'admin' },
  { nama: 'YEYEN LESTARI, S.Pd.', pin: '1234', peran: 'guru' },
  { nama: 'EDI SAPTONO ROSIDI, S.Pd.', pin: '1234', peran: 'guru' },
  { nama: 'ARI TRIWINARSIH, S.Pd.', pin: '1234', peran: 'guru' },
  { nama: 'ERRY WILLYANTI, S.Pd.', pin: '1234', peran: 'guru' },
  { nama: 'DADUN EKO WIDODO, S.Pd.', pin: '1234', peran: 'guru' },
  { nama: 'SRI SUBEKTI, S.Pd.', pin: '1234', peran: 'guru' },
  { nama: 'WIDIA HASTUTI, S.Pd.', pin: '1234', peran: 'guru' },
  { nama: 'BUDI MULYONO, S.Pd.', pin: '1234', peran: 'guru' },
  { nama: 'DARMINI, S.Pd.', pin: '1234', peran: 'guru' }
];

const HARI=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const BLN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const $=i=>document.getElementById(i);
let me=null,data=[],editId=null,guruList=[],adminEditIndex=null;

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
const n=v=>{v=parseInt(v,10);return isNaN(v)||v<0?0:v};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const parts=s=>{const p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])};
const fmt=s=>{const d=parts(s);return HARI[d.getDay()]+', '+d.getDate()+' '+BLN[d.getMonth()]+' '+d.getFullYear()};

function normalizeGuru(raw){
  const list = Array.isArray(raw) ? raw : Array.isArray(raw && raw.guru) ? raw.guru : [];
  return list
    .map(g => ({ nama: String(g && g.nama || '').trim(), peran: String(g && g.peran || 'guru').trim() }))
    .filter(g => g.nama);
}

function normalizeUsers(raw){
  const list = Array.isArray(raw) ? raw : [];
  return list
    .map(u => ({ nama: String(u && u.nama || '').trim(), pin: String(u && u.pin || '').trim(), peran: String(u && u.peran || 'guru').trim() }))
    .filter(u => u.nama);
}

function ensureSeedData(){
  try {
    const storedGuru = JSON.parse(localStorage.getItem(STORAGE.guru) || 'null');
    if (!storedGuru || !Array.isArray(storedGuru) || !storedGuru.length) {
      localStorage.setItem(STORAGE.guru, JSON.stringify(DEFAULT_GURU));
    }

    const storedUsers = JSON.parse(localStorage.getItem(STORAGE.users) || 'null');
    if (!storedUsers || !Array.isArray(storedUsers) || !storedUsers.length) {
      localStorage.setItem(STORAGE.users, JSON.stringify(DEFAULT_USERS));
    }

    const storedData = JSON.parse(localStorage.getItem(STORAGE.journals) || 'null');
    if (!Array.isArray(storedData)) {
      localStorage.setItem(STORAGE.journals, JSON.stringify([]));
    }
  } catch (e) {
    console.warn('Seed local storage gagal:', e);
  }
}

async function loadGuruList(){
  ensureSeedData();
  try {
    const resp = await fetch('./data/guru.json', { cache: 'no-store' });
    if (resp.ok) {
      const body = await resp.json();
      const list = normalizeGuru(body);
      if (list.length) {
        localStorage.setItem(STORAGE.guru, JSON.stringify(list));
        return list;
      }
    }
  } catch (e) {
    console.warn('File data/guru.json tidak terbaca, memakai data lokal:', e);
  }

  try {
    const stored = JSON.parse(localStorage.getItem(STORAGE.guru) || 'null');
    const list = normalizeGuru(stored || DEFAULT_GURU);
    if (list.length) return list;
  } catch (e) {}

  return normalizeGuru(DEFAULT_GURU);
}

function getUsers(){
  try {
    const stored = JSON.parse(localStorage.getItem(STORAGE.users) || 'null');
    const users = normalizeUsers(stored || DEFAULT_USERS);
    if (users.length) return users;
  } catch (e) {}
  return normalizeUsers(DEFAULT_USERS);
}

function saveUsers(nextUsers){
  const users = normalizeUsers(nextUsers);
  localStorage.setItem(STORAGE.users, JSON.stringify(users));
  const guru = users.map(u => ({ nama: u.nama, peran: u.peran || 'guru' }));
  localStorage.setItem(STORAGE.guru, JSON.stringify(guru));
  guruList = guru;
  populateLoginList();
  renderAdminList();
}

function getJournals(){
  try {
    const stored = JSON.parse(localStorage.getItem(STORAGE.journals) || 'null');
    return Array.isArray(stored) ? stored : [];
  } catch (e) {
    return [];
  }
}

function saveJournals(list){
  localStorage.setItem(STORAGE.journals, JSON.stringify(list));
}

function populateLoginList(){
  const users = getUsers();
  $('ln').innerHTML = '<option value="">Pilih nama Anda</option>' + users.map(u => '<option>' + esc(u.nama) + '</option>').join('');
}

async function api(body){
  ensureSeedData();
  const action = body && body.aksi;
  const users = getUsers();

  if (action === 'masuk') {
    const user = users.find(u => u.nama === String(body.nama || '').trim());
    if (!user) return { ok: false, pesan: 'Nama guru tidak terdaftar.' };
    if (String(user.pin) !== String(body.pin || '')) return { ok: false, pesan: 'PIN salah.' };
    return { ok: true, nama: user.nama, peran: user.peran || 'guru' };
  }

  if (action === 'daftar') {
    return { ok: true, data: getJournals().sort((a,b)=>String(a.tgl).localeCompare(String(b.tgl))) };
  }

  if (action === 'simpan') {
    const item = body.jurnal || {};
    const base = { ...item, hadir: n(item.total) - n(item.sakit) - n(item.izin) - n(item.alpa) };
    const list = getJournals();
    if (base.id) {
      const idx = list.findIndex(x => String(x.id) === String(base.id));
      if (idx >= 0) list[idx] = { ...list[idx], ...base }; else list.push(base);
    } else {
      base.id = Date.now() + Math.random().toString(16).slice(2);
      list.push(base);
    }
    saveJournals(list);
    return { ok: true, id: base.id };
  }

  if (action === 'hapus') {
    const id = body.id;
    const list = getJournals().filter(x => String(x.id) !== String(id));
    saveJournals(list);
    return { ok: true };
  }

  return { ok: false, pesan: 'Aksi tidak didukung di mode offline.' };
}

function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2800)}

async function init(){
  guruList = await loadGuruList();
  populateLoginList();

  try {
    const s = JSON.parse(localStorage.getItem('jurnalLogin') || 'null');
    if (s && s.nama) {
      me = s;
      const r = await api({ aksi: 'masuk', nama: s.nama, pin: s.pin });
      if (r.ok) {
        me = { nama: r.nama, pin: s.pin, peran: r.peran };
        return start();
      }
      me = null;
    }
  } catch (e) { me = null; }
}

async function login(){
  const nama = $('ln').value;
  const pin = $('lp').value.trim();
  $('lerr').textContent = '';
  if (!nama || !pin) {
    $('lerr').textContent = 'Pilih nama dan isi PIN.';
    return;
  }

  busy($('login'), true);
  me = { nama, pin };
  const r = await api({ aksi: 'masuk', nama, pin });
  busy($('login'), false);

  if (!r.ok) {
    me = null;
    $('lerr').textContent = r.pesan;
    return;
  }

  me = { nama: r.nama, pin, peran: r.peran };
  try { localStorage.setItem('jurnalLogin', JSON.stringify(me)); } catch (e) {}
  start();
}

function logout(){
  try { localStorage.removeItem('jurnalLogin'); } catch (e) {}
  location.reload();
}

function busy(btn, on){ btn.disabled = on; }

function getCurrentUsers(){
  return normalizeUsers(getUsers());
}

function renderAdminList(){
  const users = getCurrentUsers();
  if (!users.length) {
    $('adminRows').innerHTML = '<tr><td colspan="5" class="empty">Belum ada data guru.</td></tr>';
    return;
  }

  $('adminRows').innerHTML = users.map((u, i) => `
    <tr>
      <td class="n">${i + 1}</td>
      <td>${esc(u.nama)}</td>
      <td>${esc(u.pin)}</td>
      <td>${esc(u.peran)}</td>
      <td>
        <button class="sm" data-edit-user="${i}">Edit</button>
        <button class="sm dg" data-delete-user="${i}">Hapus</button>
      </td>
    </tr>
  `).join('');
}

function resetAdminForm(){
  adminEditIndex = null;
  $('adminNama').value = '';
  $('adminPin').value = '';
  $('adminPeran').value = 'guru';
  $('adminSave').textContent = 'Simpan perubahan';
}

function openAdminForm(index){
  const users = getCurrentUsers();
  const user = users[index];
  if (!user) return;
  adminEditIndex = index;
  $('adminNama').value = user.nama;
  $('adminPin').value = user.pin;
  $('adminPeran').value = user.peran || 'guru';
  $('adminSave').textContent = 'Simpan perubahan';
  $('adminNama').focus();
}

function saveAdminUser(){
  const nama = $('adminNama').value.trim();
  const pin = $('adminPin').value.trim();
  const peran = $('adminPeran').value;

  if (!nama || !pin) {
    toast('Nama dan PIN wajib diisi.');
    return;
  }

  const users = getCurrentUsers();

  if (adminEditIndex === null) {
    if (users.some(u => u.nama.toLowerCase() === nama.toLowerCase())) {
      toast('Nama guru sudah ada.');
      return;
    }
    users.push({ nama, pin, peran });
  } else {
    users[adminEditIndex] = { ...users[adminEditIndex], nama, pin, peran };
  }

  saveUsers(users);
  resetAdminForm();
  toast('Data guru berhasil disimpan.');
  if (me && me.peran === 'admin') {
    start();
  }
}

function deleteAdminUser(index){
  const users = getCurrentUsers();
  const target = users[index];
  if (!target) return;
  if (!confirm('Hapus guru "' + target.nama + '"?')) return;
  users.splice(index, 1);
  saveUsers(users);
  if (adminEditIndex === index) resetAdminForm();
  toast('Guru dihapus.');
  if (me && me.peran === 'admin') {
    start();
  }
}

async function start(){
  $('loginbox').classList.add('hide');
  $('app').classList.remove('hide');
  $('out').classList.remove('hide');

  const admin = me.peran === 'admin';
  $('who').textContent = me.nama + (admin ? ' (admin)' : '');
  $('ltitle').textContent = admin ? 'Daftar jurnal semua guru' : 'Daftar jurnal saya';

  const users = getCurrentUsers();
  const names = users.filter(g => g.peran !== 'admin').map(g => g.nama);
  $('guru').innerHTML = (admin ? names : [me.nama]).map(x => '<option>' + esc(x) + '</option>').join('') || '<option>' + esc(me.nama) + '</option>';
  $('guru').disabled = !admin;
  if (admin) $('fgbox').classList.remove('hide'); else $('fgbox').classList.add('hide');

  if (admin) {
    $('adminpanel').classList.remove('hide');
    renderAdminList();
    resetAdminForm();
  } else {
    $('adminpanel').classList.add('hide');
  }

  $('bulan').value = today().slice(0, 7);
  clearForm(false);
  await refresh();
}

async function refresh(){
  const r = await api({ aksi: 'daftar' });
  if (!r.ok) {
    toast(r.pesan);
    return;
  }

  data = Array.isArray(r.data) ? r.data : [];
  if (me && me.peran === 'admin') {
    const cur = $('fg').value;
    const u = [...new Set(data.map(x => x.guru))].sort();
    $('fg').innerHTML = '<option value="">Semua guru</option>' + u.map(x => '<option>' + esc(x) + '</option>').join('');
    $('fg').value = u.includes(cur) ? cur : '';
  }
  render();
}

function setHari(){$('hari').value=$('tgl').value?HARI[parts($('tgl').value).getDay()]:''}
function hitung(){$('hadir').value=n($('total').value)-n($('sakit').value)-n($('izin').value)-n($('alpa').value)}

function clearForm(keep){editId=null;$('ftitle').textContent='Catat jurnal baru';$('save').textContent='Simpan jurnal';['jam','kelas','mapel','materi','ket'].forEach(i=>$(i).value='');['total','sakit','izin','alpa'].forEach(i=>$(i).value=i==='total'?0:0);$('tgl').value=today();$('hari').value=HARI[parts($('tgl').value).getDay()];$('hadir').value='0';if(!keep){$('guru').value=($('guru').options[0]||{}).value||'';}}

async function save(){
  const r={id:editId,tgl:$('tgl').value,guru:$('guru').value,jam:$('jam').value.trim(),kelas:$('kelas').value.trim(),mapel:$('mapel').value.trim(),materi:$('materi').value.trim(),total:n($('total').value),sakit:n($('sakit').value),izin:n($('izin').value),alpa:n($('alpa').value),ket:$('ket').value.trim()};
  if(!r.tgl||!r.guru||!r.jam||!r.mapel||!r.materi){toast('Lengkapi tanggal, nama guru, jam ke-, mata pelajaran, dan uraian materi.');return}
  if(r.sakit+r.izin+r.alpa>r.total){toast('Jumlah sakit, izin, dan alpa melebihi jumlah siswa di kelas.');return}
  busy($('save'),true);const res=await api({aksi:'simpan',jurnal:r});busy($('save'),false);
  if(!res.ok){toast(res.pesan);return}
  toast(editId?'Jurnal diperbarui.':'Jurnal tersimpan.');$('bulan').value=r.tgl.slice(0,7);clearForm(true);await refresh();
}

function view(){
  const b=$('bulan').value,q=$('cari').value.toLowerCase(),g=me&&me.peran==='admin'?$('fg').value:'';
  return data.filter(r=>(!b||r.tgl.slice(0,7)===b)&&(!g||r.guru===g)&&(!q||(r.mapel+' '+r.kelas+' '+r.materi+' '+r.guru).toLowerCase().includes(q))).sort((a,c)=>a.tgl===c.tgl?a.jam.localeCompare(c.jam):a.tgl.localeCompare(c.tgl));
}

function render(){
  const l=view(),t={total:0,hadir:0,sakit:0,izin:0,alpa:0};let h='';
  l.forEach((r,i)=>{for(const k in t)t[k]+=r[k];h+='<tr><td class="n">'+(i+1)+'</td><td>'+esc(fmt(r.tgl))+'</td><td>'+esc(r.guru)+'</td><td class="n">'+esc(r.jam)+'</td><td>'+esc(r.kelas)+'</td><td>'+esc(r.mapel)+'</td><td>'+esc(r.materi)+'</td><td class="n">'+esc(r.total)+'</td><td class="n">'+esc(r.hadir)+'</td><td class="n">'+esc(r.sakit)+'</td><td class="n">'+esc(r.izin)+'</td><td class="n">'+esc(r.alpa)+'</td><td class="n"><button class="sm" data-edit="'+r.id+'">Edit</button> <button class="sm dg" data-del="'+r.id+'">Hapus</button></td></tr>'});
  $('rows').innerHTML=h||'<tr><td colspan="13" class="empty">Belum ada jurnal pada pilihan ini. Isi form di atas lalu pilih Simpan jurnal.</td></tr>';
  $('foot').innerHTML=l.length?'<tr><td colspan="7">Total '+l.length+' pertemuan</td><td class="n">'+t.total+'</td><td class="n">'+t.hadir+'</td><td class="n">'+t.sakit+'</td><td class="n">'+t.izin+'</td><td class="n">'+t.alpa+'</td><td></td></tr>':'';
  const b=$('bulan').value;
  $('ph').innerHTML='<h2>Jurnal Harian Mengajar</h2><div>Guru: '+esc((me&&me.peran==='admin'&&$('fg').value)||(me&&me.peran==='admin'?'Semua guru':me?me.nama:''))+' | Periode: '+esc(b?BLN[+b.slice(5)-1]+' '+b.slice(0,4):'Semua bulan')+'</div>';
}

function edit(id){const r=data.find(x=>x.id===id);if(!r)return;editId=id;$('ftitle').textContent='Ubah jurnal';$('save').textContent='Simpan perubahan';['tgl','jam','kelas','mapel','materi','total','sakit','izin','alpa','ket'].forEach(k=>{$(k).value = r[k] ?? ''});$('hari').value=HARI[parts(r.tgl).getDay()];$('guru').value=r.guru;hitung();}

async function del(id){if(!confirm('Hapus jurnal ini? Data yang dihapus tidak bisa dikembalikan.'))return;const r=await api({aksi:'hapus',id});toast(r.ok?'Jurnal dihapus.':r.pesan);if(r.ok)await refresh();}

function csv(){const l=view();if(!l.length){toast('Tidak ada data untuk diunduh.');return}const rows=[['No','Hari','Tanggal','Nama Guru','Jam ke-','Kelas','Mata Pelajaran','Uraian Materi','Jumlah Siswa','Hadir','Sakit','Izin','Alpa','Catatan']];l.forEach((r,i)=>rows.push([i+1,fmt(r.tgl).split(',')[0],r.tgl,r.guru,r.jam,r.kelas,r.mapel,r.materi,r.total,r.hadir,r.sakit,r.izin,r.alpa,r.ket || '']));const csv=rows.map(row=>row.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='jurnal-harian.csv';a.click();URL.revokeObjectURL(a.href);}

$('login').onclick=login;$('lp').onkeydown=e=>{if(e.key==='Enter')login()};$('out').onclick=logout;$('tgl').onchange=setHari;['total','sakit','izin','alpa'].forEach(i=>$(i).oninput=hitung);$('save').onclick=save;$('reset').onclick=()=>clearForm(false);$('semua').onclick=()=>{$('bulan').value='';render();};$('cari').oninput=render;$('month').oninput=render;$('csv').onclick=csv;$('print').onclick=()=>window.print();$('refresh').onclick=refresh;$('adminSave').onclick=saveAdminUser;$('adminAdd').onclick=()=>{resetAdminForm();$('adminNama').focus();};$('adminResetForm').onclick=resetAdminForm;document.addEventListener('click',e=>{const editBtn=e.target.closest('[data-edit]');if(editBtn){edit(editBtn.dataset.edit);return;}const delBtn=e.target.closest('[data-del]');if(delBtn){del(delBtn.dataset.del);return;}const editUser=e.target.closest('[data-edit-user]');if(editUser){openAdminForm(+editUser.dataset.editUser);return;}const delUser=e.target.closest('[data-delete-user]');if(delUser){deleteAdminUser(+delUser.dataset.deleteUser);return;}});$('adminPeran').value='guru';init();
</script>
</body>
</html>
